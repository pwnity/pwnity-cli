[pytest]
testpaths = tests
markers =
    unit: mark a test as a unit test (fast, no external processes)
    integration: mark a test as an integration test

# Configuration for pytest-order
# This configuration ensures that all tests without a specific group marker
# (our unit tests) are run first, and integration tests are run last.
[ordering]
order_scope = session
order_groups =
    # Any test without a marker falls into the default group and runs first.
    last: integration